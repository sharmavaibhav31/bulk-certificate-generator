version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cert_generator_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cert_generator_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cert_generator_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cert_generator_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/cert_generator_db
      WORKER_MODE: thread
      WORKER_MAX_WORKERS: 4
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./samples:/app/samples

  frontend:
    image: node:20-alpine
    container_name: cert_generator_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - api

volumes:
  pgdata:
